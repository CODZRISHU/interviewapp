name: Kevin AI CI

on:
  pull_request:
    branches:
      - dev
      - test
      - prod
  push:
    branches:
      - dev
      - test
      - prod

concurrency:
  group: kevin-ai-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kevin_ai_bot-main/backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: kevin_ai_bot-main/backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Compile backend
        run: python -m compileall .

      - name: Pytest hook
        run: |
          if python -c "import pytest" 2>/dev/null; then
            python -m pytest ../tests || status=$?
            if [ "${status:-0}" -eq 5 ]; then
              echo "pytest is installed, but no backend tests were found yet."
            else
              exit "${status:-0}"
            fi
          else
            echo "pytest is not installed yet; skipping backend pytest hook."
          fi

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kevin_ai_bot-main/frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: kevin_ai_bot-main/frontend/yarn.lock

      - name: Enable Corepack
        run: corepack enable

      - name: Install frontend dependencies
        run: corepack yarn install --frozen-lockfile

      - name: Run frontend tests
        run: corepack yarn test --watchAll=false --runInBand --passWithNoTests

      - name: Build frontend
        run: corepack yarn build

  docker:
    name: Backend Docker build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -f kevin_ai_bot-main/backend/Dockerfile -t kevin-ai-backend:ci kevin_ai_bot-main
