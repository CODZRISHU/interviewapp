name: Kevin AI CI

on:
  pull_request:
    branches:
      - dev
      - test
      - prod
      - main
  push:
    branches:
      - dev
      - test
      - prod
      - main

concurrency:
  group: kevin-ai-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend checks & Pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kevin_ai_bot-main/backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: kevin_ai_bot-main/backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Compile backend
        run: python -m compileall .

      - name: Run Pytest Test Suite
        env:
          PYTHONPATH: .
        run: python -m pytest tests/ -v

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kevin_ai_bot-main/frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: kevin_ai_bot-main/frontend/yarn.lock

      - name: Enable Corepack
        run: corepack enable

      - name: Install frontend dependencies
        run: corepack yarn install

      - name: Run frontend tests
        run: corepack yarn test --watchAll=false --runInBand --passWithNoTests

      - name: Build frontend
        run: corepack yarn build

  docker:
    name: Backend Docker build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -f kevin_ai_bot-main/backend/Dockerfile -t kevin-ai-backend:ci kevin_ai_bot-main
